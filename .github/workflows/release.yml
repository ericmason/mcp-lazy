name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: darwin-arm64
            os: macos-latest
          - target: x86_64-apple-darwin
            name: darwin-amd64
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            name: linux-amd64
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            name: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          if [[ "$TARGET" == *-linux-musl ]]; then
            sudo apt-get update -q
            sudo apt-get install -y -q musl-tools
          fi
      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          name="mcp-lazy-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/mcp-lazy" README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" dist/*.tar.gz dist/SHA256SUMS --clobber
