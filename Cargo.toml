[package]
name = "mcp-lazy"
version = "0.1.0"
edition = "2021"
description = "Lazy-start stdio proxy for local MCP servers"
license = "MIT"
repository = "https://github.com/ericmason/mcp-lazy"
readme = "README.md"
keywords = ["mcp", "proxy", "stdio", "claude", "codex"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
libc = { version = "0.2.191", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = { version = "0.11.1", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
